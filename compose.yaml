name: wbengine-admin
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: wbengine_admin
      MYSQL_USER: wbadmin
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    volumes:
      - admin-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13384}:3306"
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      MASTER_KEY: ${MASTER_KEY:?}
      ORIGIN: ${ORIGIN:?}
      HOST: 0.0.0.0
      PORT: 3000
      BODY_SIZE_LIMIT: 1048576
      REMOTE_IP_ALLOWLIST: ${REMOTE_IP_ALLOWLIST:-}
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  admin-db:
