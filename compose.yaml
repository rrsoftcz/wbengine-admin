name: wbengine-admin
services:
  app:
    build: .
    environment:
      DATABASE_PATH: /app/data/admin.sqlite
      MASTER_KEY: ${MASTER_KEY:?}
      ORIGIN: ${ORIGIN:?}
      HOST: 0.0.0.0
      PORT: 3000
      BODY_SIZE_LIMIT: 1048576
      REMOTE_IP_ALLOWLIST: ${REMOTE_IP_ALLOWLIST:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - admin-data:/app/data
volumes:
  admin-data:
